services:
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: visor-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
      CURL_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability

  tempo:
    build:
      context: .
      dockerfile: Dockerfile.tempo
    image: visor/tempo-with-busybox:2.10.1
    container_name: visor-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    labels:
      autoheal: "true"
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - observability

  otelcol:
    build:
      context: .
      dockerfile: Dockerfile.otelcol
    image: visor/otelcol-with-busybox:0.147.0
    container_name: visor-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    labels:
      autoheal: "true"
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: visor-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    labels:
      autoheal: "true"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      otelcol:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q 'Prometheus' || wget -qO- http://127.0.0.1:9090/api/v1/status/runtimeinfo >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - observability

  grafana:
    image: grafana/grafana:12.4.0
    container_name: visor-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    labels:
      autoheal: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "8001:3000"
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - observability

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:

networks:
  observability:
    name: visor-observability
