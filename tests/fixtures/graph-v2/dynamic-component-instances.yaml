version: "1.0"
max_parallelism: 2

claim_types:
  component.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [components]
      properties:
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, path]
            properties:
              id: {type: string, minLength: 1}
              path: {type: string, minLength: 1}
  component.item@1:
    schema:
      type: object
      additionalProperties: false
      required: [id, path]
      properties:
        id: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
  component.onboarded@1:
    schema:
      type: object
      additionalProperties: false
      required: [id, findings]
      properties:
        id: {type: string, minLength: 1}
        findings: {type: array, items: {type: string}}

subgraphs:
  onboard-component:
    input:
      name: component
      claim: component.item@1
    checks:
      inspect:
        type: noop
        consumes:
          - claim: component.item@1
            as: component
        emits:
          - claim: component.onboarded@1
            from: output
      summarize:
        type: noop
        consumes:
          - claim: component.onboarded@1
            as: inspected

checks:
  discover-components:
    type: noop
    emits:
      - claim: component.catalog@1
        from: output
    expand:
      claim: component.catalog@1
      template: onboard-component
      items_pointer: /components
      key_pointer: /id
      item_claim: component.item@1
