                project_id: { type: string, minLength: 1 }
                component_id: { type: string, minLength: 1 }
                sorted_owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                sorted_dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
checks:
  project:
    type: memory
    operation: set
    key: project-catalog
    value:
      projects:
        - project_id: journalservice
          root: .
    emits:
      - claim: project.catalog@1
        from: output
    expand:
      claim: project.catalog@1
      template: discover-project
      items_pointer: /projects
      key_pointer: /project_id
      item_claim: project.discovery_item@1

subgraphs:
  discover-project:
    input: { name: project, claim: project.discovery_item@1 }
    checks:
      structural_inventory:
        type: proof-structural-inventory
        consumes:
          - { claim: project.discovery_item@1, as: project }
        emits:
          - { claim: proof.structural_inventory@1, from: output }
      inspect:
        type: governed-proof-inspect
        message: >-
          Execute the bound Proof discovery role and return only the closed canonical catalog JSON.
          For this bounded demo, return exactly 3 components. The owned_paths arrays must form
          an exact once-only partition of every path in current_inventory.sorted_paths, including
          tests and manifests such as go.mod. Each dependency_closure may contain only exact paths
          from current_inventory.sorted_paths and must include every owned path. Never use package,
          symbol, or component labels as paths.
        instructions: Discover the project's independently onboardable components; every path must be observed in the supplied Proof inventory. Do not invent files.
        profile: luna-xhigh-readonly-v1
        invocation:
          role_id: onboard
          stance: owner
          subject:
            kind: project
            id: journalservice
            fingerprint: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          output_schema_id: proof.component-catalog-candidate@1
          output_schema: 
        invocation_digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        result_schema: '{"type":"object","additionalProperties":false,"required":["version","project_id","components"],"properties":{"version":{"const":"proof.component-catalog-candidate/v1"},"project_id":{"type":"string","minLength":1},"components":{"type":"array","minItems":3,"maxItems":3,"items":{"type":"object","additionalProperties":false,"required":["id","responsibility","owned_paths"],"properties":{"id":{"type":"string","minLength":1},"responsibility":{"type":"string","minLength":1},"owned_paths":{"type":"array","minItems":1,"items":{"type":"string","minLength":1},"uniqueItems":true},"dependency_closure":{"type":"array","minItems":1,"items":{"type":"string","minLength":1},"uniqueItems":true},"entry_points":{"type":"array","items":{"type":"string","minLength":1}},"state_effects":{"type":"array","items":{"type":"string","minLength":1}},"interfaces":{"type":"array","items":{}},"uncertainty":{"type":"array","items":{"type":"string","minLength":1}}}}}}}'
        consumes:
          - { claim: project.discovery_item@1, as: project }
          - { claim: proof.structural_inventory@1, as: current_inventory }
        emits:
          - { claim: proof.candidate@1, from: output }
      proof_admit:
        type: proof-admit
        consumes:
          - { claim: proof.candidate@1, as: candidate }
        emits:
          - { claim: proof.admitted_receipt@1, from: output }
      verify:
        type: noop
        consumes:
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
      revalidate_catalog:
        type: proof-catalog-revalidate
        depends_on: [verify]
        consumes:
          - { claim: proof.structural_inventory@1, as: current_inventory }
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
        emits:
          - { claim: proof.catalog_revalidation@1, from: output }
      materialize_catalog:
        type: proof-admitted-catalog
        consumes:
          - { claim: proof.structural_inventory@1, as: current_inventory }
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
          - { claim: proof.catalog_revalidation@1, as: current_revalidation }
        emits:
          - { claim: component.catalog@1, from: output }
        expand:
          claim: component.catalog@1
          template: onboard-component
          items_pointer: /components
          key_pointer: /component_id
          item_claim: component.work_item@1
      project_reconcile:
        type: proof-project-reconcile
        depends_on: [materialize_catalog]
        wait_for_expansion:
          owner: materialize_catalog
          terminal_node: verify
        emits:
          - { claim: proof.project_reconciliation_receipt@1, from: output }

  onboard-component:
    input: { name: component, claim: component.work_item@1 }
    checks:
      inspect:
        type: governed-proof-inspect
        profile: luna-xhigh-readonly-v1
        invocation:
          role_id: onboard
          stance: owner
          subject: { kind: component }
          output_schema_id: reqproof.component-onboarding/v1
          output_schema: 
        consumes:
          - { claim: component.work_item@1, as: component }
        emits:
          - { claim: proof.candidate@1, from: output }
      proof_admit:
        type: proof-admit
        consumes:
          - { claim: proof.candidate@1, as: candidate }
        emits:
          - { claim: proof.admitted_receipt@1, from: output }
      verify:
        type: noop
        consumes:
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
