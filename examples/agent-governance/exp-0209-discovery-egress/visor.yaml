# EXP-0209 discovery egress.  This is the operational graph source of truth.
# The project catalog is one manually selected project.  Its discovery
# subgraph is allowed to fan out only after Proof candidate admission and a
# current Proof catalog-revalidation projection. Component boundaries are
# model output and are intentionally absent from this authored file.
version: "1.0"
max_parallelism: 3
workspace:
  enabled: false

claim_types:
  project.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [project_id, root]
            properties:
              project_id: { type: string, minLength: 1 }
              root: { type: string, minLength: 1 }
  project.discovery_item@1:
    schema:
      type: object
      additionalProperties: false
      required: [project_id, root]
      properties:
        project_id: { type: string, minLength: 1 }
        root: { type: string, minLength: 1 }
  proof.candidate@1:
    schema:
      type: object
      additionalProperties: false
      required: [version, project_id, components]
      properties:
        version: { const: proof.component-catalog-candidate/v1 }
        project_id: { type: string, minLength: 1 }
        components:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [id, responsibility, owned_paths, dependency_closure, entry_points, state_effects, interfaces, uncertainty]
            properties:
              id: { type: string, minLength: 1 }
              responsibility: { type: string, minLength: 1 }
              owned_paths: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
              dependency_closure: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
              entry_points: { type: array, items: { type: string, minLength: 1 } }
              state_effects: { type: array, items: { type: string, minLength: 1 } }
              interfaces: { type: array, items: {} }
              uncertainty: { type: array, items: { type: string, minLength: 1 } }
  proof.admitted_receipt@1:
    schema: { type: object }
  proof.structural_inventory@1:
    schema:
      type: object
      additionalProperties: false
      required: [version, authority, sorted_paths, sorted_module_paths, boundary_fingerprint, input_state]
      properties:
        version: { const: proof.structural-inventory/v1 }
        authority:
          type: object
          additionalProperties: false
          required: [version, project_id, subject_fingerprint, code_fingerprint, tests_fingerprint]
          properties:
            version: { const: proof.project-authority/v1 }
            project_id: { type: string, minLength: 1 }
            subject_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            code_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            tests_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        sorted_paths: { type: array, items: { type: string } }
        sorted_module_paths: { type: array, items: { type: string } }
        boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        input_state: { type: array, items: { type: object } }
  proof.catalog_revalidation@1:
    schema:
      type: object
      additionalProperties: false
      required: [version, inventory, catalog, work_items, receipt]
      properties:
        version: { const: proof.catalog-revalidation/v1 }
        inventory: { type: object }
        catalog: { type: object }
        work_items: { type: array, minItems: 2, maxItems: 4, items: { type: object } }
        receipt: { type: object }
  component.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [components]
      properties:
        components:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
              - version
              - project_id
              - component_id
              - sorted_owned_paths
              - sorted_dependency_closure
              - proof_path_mapping
              - proof_input_state
              - proof_component_subject
            properties:
              version: { const: reqproof.onboarding-component-work-item/v1 }
              project_id: { type: string, minLength: 1 }
              component_id: { type: string, minLength: 1 }
              sorted_owned_paths: { type: array, items: { type: string } }
              sorted_dependency_closure: { type: array, items: { type: string } }
              proof_path_mapping: { type: object }
              proof_input_state: { type: array }
              proof_component_subject: { type: object }
  component.work_item@1:
    schema:
      type: object
      additionalProperties: false
      required:
        - version
        - project_id
        - component_id
        - sorted_owned_paths
        - sorted_dependency_closure
        - proof_path_mapping
        - proof_input_state
        - proof_component_subject
      properties:
        version: { const: reqproof.onboarding-component-work-item/v1 }
        project_id: { type: string, minLength: 1 }
        component_id: { type: string, minLength: 1 }
        sorted_owned_paths: { type: array, items: { type: string } }
        sorted_dependency_closure: { type: array, items: { type: string } }
        proof_path_mapping: { type: object }
        proof_input_state: { type: array }
        proof_component_subject: { type: object }
  component.onboarded@1:
    schema:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: onboarded }

checks:
  project:
    type: memory
    operation: set
    key: project-catalog
    value:
      projects:
        - project_id: journalservice
          root: .
    emits:
      - claim: project.catalog@1
        from: output
    expand:
      claim: project.catalog@1
      template: discover-project
      items_pointer: /projects
      key_pointer: /project_id
      item_claim: project.discovery_item@1

subgraphs:
  discover-project:
    input: { name: project, claim: project.discovery_item@1 }
    checks:
      structural_inventory:
        type: proof-structural-inventory
        consumes:
          - { claim: project.discovery_item@1, as: project }
        emits:
          - { claim: proof.structural_inventory@1, from: output }
      inspect:
        type: governed-proof-inspect
        message: Execute the bound Proof discovery role and return only the closed canonical catalog JSON.
        instructions: Discover the project's independently onboardable components; every path must be observed in the supplied Proof inventory. Do not invent files.
        profile: luna-xhigh-readonly-v1
        invocation:
          role_id: onboard
          stance: owner
          subject:
            kind: project
            id: journalservice
            fingerprint: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          output_schema_id: proof.component-catalog-candidate@1
          output_schema: 
        invocation_digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        result_schema: '{"type":"object","additionalProperties":false,"required":["version","project_id","components"],"properties":{"version":{"const":"proof.component-catalog-candidate/v1"},"project_id":{"type":"string","minLength":1},"components":{"type":"array","minItems":2,"maxItems":4,"items":{"type":"object","additionalProperties":false,"required":["id","responsibility","owned_paths","dependency_closure","entry_points","state_effects","interfaces","uncertainty"],"properties":{"id":{"type":"string","minLength":1},"responsibility":{"type":"string","minLength":1},"owned_paths":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},"dependency_closure":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},"entry_points":{"type":"array","items":{"type":"string","minLength":1}},"state_effects":{"type":"array","items":{"type":"string","minLength":1}},"interfaces":{"type":"array","items":{}},"uncertainty":{"type":"array","items":{"type":"string","minLength":1}}}}}}}'
        consumes:
          - { claim: project.discovery_item@1, as: project }
          - { claim: proof.structural_inventory@1, as: current_inventory }
        emits:
          - { claim: proof.candidate@1, from: output }
      proof_admit:
        type: proof-admit
        consumes:
          - { claim: proof.candidate@1, as: candidate }
        emits:
          - { claim: proof.admitted_receipt@1, from: output }
      verify:
        type: noop
        consumes:
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
      revalidate_catalog:
        type: proof-catalog-revalidate
        depends_on: [verify]
        consumes:
          - { claim: proof.structural_inventory@1, as: current_inventory }
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
        emits:
          - { claim: proof.catalog_revalidation@1, from: output }
      materialize_catalog:
        type: proof-admitted-catalog
        consumes:
          - { claim: proof.structural_inventory@1, as: current_inventory }
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
          - { claim: proof.catalog_revalidation@1, as: current_revalidation }
        emits:
          - { claim: component.catalog@1, from: output }
        expand:
          claim: component.catalog@1
          template: onboard-component
          items_pointer: /components
          key_pointer: /component_id
          item_claim: component.work_item@1

  onboard-component:
    input: { name: component, claim: component.work_item@1 }
    checks:
      inspect:
        type: memory
        operation: set
        key: component-onboarded
        value: { status: onboarded }
        consumes:
          - { claim: component.work_item@1, as: component }
        emits:
          - { claim: component.onboarded@1, from: output }
