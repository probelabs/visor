# EXP-0209 discovery egress.  This is the operational graph source of truth.
# The project catalog is one manually selected project.  Its discovery
# subgraph is allowed to fan out only after Proof candidate admission and a
# current Proof catalog-revalidation projection. Component boundaries are
# model output and are intentionally absent from this authored file.
version: "1.0"
max_parallelism: 3
workspace:
  enabled: false

claim_types:
  project.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [project_id, root]
            properties:
              project_id: { type: string, minLength: 1 }
              root: { type: string, minLength: 1 }
  project.discovery_item@1:
    schema:
      type: object
      additionalProperties: false
      required: [project_id, root]
      properties:
        project_id: { type: string, minLength: 1 }
        root: { type: string, minLength: 1 }
  proof.candidate@1:
    schema:
      oneOf:
        - type: object
          additionalProperties: false
          required: [version, project_id, components]
          properties:
            version: { const: proof.component-catalog-candidate/v1 }
            project_id: { type: string, minLength: 1 }
            components:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: object
                additionalProperties: false
                required: [id, responsibility, owned_paths]
                properties:
                  id: { type: string, minLength: 1 }
                  responsibility: { type: string, minLength: 1 }
                  owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                  dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                  entry_points: { type: array, items: { type: string, minLength: 1 } }
                  state_effects: { type: array, items: { type: string, minLength: 1 } }
                  interfaces: { type: array, items: {} }
                  uncertainty: { type: array, items: { type: string, minLength: 1 } }
        - type: object
          additionalProperties: false
          required: [schema, project, shard, reviewedFiles, requirements, interfaces, findings, unknowns, repositoryMutated, commandsExecuted, checklistCompleted]
          properties:
            schema: { const: reqproof.component-onboarding/v1 }
            project: { type: string }
            shard: { type: string }
            reviewedFiles:
              type: array
              minItems: 1
              maxItems: 64
              items:
                type: object
                additionalProperties: false
                required: [path, coordinates]
                properties:
                  path: { type: string }
                  coordinates:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [path, line]
                      properties:
                        path: { type: string }
                        line: { type: integer, minimum: 1 }
            requirements:
              type: array
              minItems: 4
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required: [id, text, coordinates]
                properties:
                  id: { type: string, pattern: "^(STK|SYS|SW|INT)-" }
                  text: { type: string }
                  coordinates:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [path, line]
                      properties:
                        path: { type: string }
                        line: { type: integer, minimum: 1 }
            interfaces:
              type: array
              maxItems: 32
              items:
                type: object
                additionalProperties: false
                required: [name, coordinates]
                properties:
                  name: { type: string }
                  coordinates:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [path, line]
                      properties:
                        path: { type: string }
                        line: { type: integer, minimum: 1 }
            findings:
              type: array
              maxItems: 32
              items:
                type: object
                additionalProperties: false
                required: [id, severity, title, calibration, confidence, coordinates]
                properties:
                  id: { type: string }
                  severity: { enum: [info, low, medium, high, critical] }
                  title: { type: string }
                  calibration: { enum: [confirmed, likely, possible] }
                  confidence: { type: number, minimum: 0, maximum: 1 }
                  coordinates:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [path, line]
                      properties:
                        path: { type: string }
                        line: { type: integer, minimum: 1 }
            unknowns:
              type: array
              maxItems: 32
              items: { type: string }
            repositoryMutated: { const: false }
            commandsExecuted: { const: false }
            checklistCompleted: { const: false }
  proof.admitted_receipt@1:
    schema:
      type: object
      additionalProperties: false
      required: [Version, Status, CandidateID, ProbeResultDigest, ProbeCanonicalBytes, ClaimID, Claim, PayloadFingerprint, InvocationDigest, RoleID, Stance, Subject, ProducerCheckID, ParentClaimIDs, Binding, Termination, receipt_id, __proof_admission_wire]
      properties:
        Version: { enum: [proof.role-result-candidate-admission/v1, proof.role-result-candidate-admission/v2] }
        Status: { const: ADMITTED }
        CandidateID: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        ProbeResultDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        ProbeCanonicalBytes: { type: integer, minimum: 1 }
        ClaimID: { type: string, pattern: "^[0-9a-f]{64}$" }
        Claim: { const: proof.candidate@1 }
        PayloadFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        InvocationDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        RoleID: { const: onboard }
        Stance: { const: owner }
        Subject:
          type: object
          additionalProperties: false
          required: [kind, id, fingerprint]
          properties:
            kind: { enum: [project, component] }
            id: { type: string, minLength: 1 }
            fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        ProducerCheckID: { const: inspect }
        ParentClaimIDs: { type: array, items: { type: string, pattern: "^[0-9a-f]{64}$" } }
        Binding:
          type: object
          additionalProperties: false
          required: [ManagedRunID, SessionID, CheckID, Scope, NodeInstanceID, NodeGenerationID, AttemptID, Fence]
          properties:
            ManagedRunID: { type: string, minLength: 1 }
            SessionID: { type: string, minLength: 1 }
            CheckID: { const: inspect }
            Scope:
              type: array
              minItems: 1
              maxItems: 2
              items: { type: object, additionalProperties: false, required: [Kind, ExpansionOwnerCheck, Key, SubgraphInstanceID], properties: { Kind: { const: keyed }, ExpansionOwnerCheck: { type: string, minLength: 1 }, Key: { type: string, minLength: 1 }, SubgraphInstanceID: { type: string, pattern: "^[0-9a-f]{64}$" } } }
            NodeInstanceID: { type: string, minLength: 1 }
            NodeGenerationID: { type: string, minLength: 1 }
            AttemptID: { type: string, minLength: 1 }
            Fence: { type: integer, minimum: 1 }
        Termination:
          type: object
          additionalProperties: false
          required: [Version, Type, SessionID, Scope, Binding, CleanupStatus, ControllerDecision, FailureCode]
          properties:
            Version: { const: 1 }
            Type: { const: ManagedRunTerminated }
            SessionID: { type: string, minLength: 1 }
            Scope:
              type: array
              minItems: 1
              maxItems: 2
              items: { type: object, additionalProperties: false, required: [Kind, ExpansionOwnerCheck, Key, SubgraphInstanceID], properties: { Kind: { const: keyed }, ExpansionOwnerCheck: { type: string, minLength: 1 }, Key: { type: string, minLength: 1 }, SubgraphInstanceID: { type: string, pattern: "^[0-9a-f]{64}$" } } }
            Binding:
              type: object
              additionalProperties: false
              required: [ManagedRunID, SessionID, CheckID, Scope, NodeInstanceID, NodeGenerationID, AttemptID, Fence]
              properties:
                ManagedRunID: { type: string, minLength: 1 }
                SessionID: { type: string, minLength: 1 }
                CheckID: { const: inspect }
                Scope:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: object, additionalProperties: false, required: [Kind, ExpansionOwnerCheck, Key, SubgraphInstanceID], properties: { Kind: { const: keyed }, ExpansionOwnerCheck: { type: string, minLength: 1 }, Key: { type: string, minLength: 1 }, SubgraphInstanceID: { type: string, pattern: "^[0-9a-f]{64}$" } } }
                NodeInstanceID: { type: string, minLength: 1 }
                NodeGenerationID: { type: string, minLength: 1 }
                AttemptID: { type: string, minLength: 1 }
                Fence: { type: integer, minimum: 1 }
            CleanupStatus: { const: clean }
            ControllerDecision: { const: completed }
            FailureCode: { const: null }
        ProjectLineage:
          type: [object, 'null']
          additionalProperties: false
          required: [version, fingerprint, object_format, baseline_revision]
          properties:
            version: { const: proof.git-project-lineage-binding/v1 }
            fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            object_format: { enum: [sha1, sha256] }
            baseline_revision: { type: string, pattern: "^(sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$" }
        receipt_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        __proof_admission_wire: { type: string, minLength: 1 }
      allOf:
        - if:
            properties:
              Version: { const: proof.role-result-candidate-admission/v1 }
          then:
            not:
              properties: { ProjectLineage: {} }
              required: [ProjectLineage]
            properties:
              Subject:
                type: object
                properties:
                  kind: { const: component }
        - if:
            properties:
              Version: { const: proof.role-result-candidate-admission/v2 }
          then:
            required: [ProjectLineage]
            properties:
              Subject:
                type: object
                properties:
                  kind: { const: project }
  proof.structural_inventory@1:
    schema:
      type: object
      additionalProperties: false
      required: [version, authority, sorted_paths, sorted_module_paths, boundary_fingerprint, input_state]
      properties:
        version: { const: proof.structural-inventory/v1 }
        authority:
          type: object
          additionalProperties: false
          required: [version, project_id, subject_fingerprint, code_fingerprint, tests_fingerprint]
          properties:
            version: { const: proof.project-authority/v1 }
            project_id: { type: string, minLength: 1 }
            subject_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            code_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            tests_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        sorted_paths: { type: array, items: { type: string, minLength: 1 } }
        sorted_module_paths: { type: [array, 'null'], items: { type: string, minLength: 1 } }
        boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        input_state:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [owner_kind, owner_id, input_kind, path, file_hash]
            properties:
              owner_kind: { const: onboarding_structural_inventory }
              owner_id: { type: string, minLength: 1 }
              input_kind: { type: string, minLength: 1 }
              path: { type: string, minLength: 1 }
              file_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
  proof.catalog_revalidation@1:
    schema:
      type: object
      additionalProperties: false
      required: [version, inventory, catalog, work_items, receipt]
      properties:
        version: { const: proof.catalog-revalidation/v2 }
        inventory:
          type: object
          additionalProperties: false
          required: [version, authority, sorted_paths, sorted_module_paths, boundary_fingerprint, input_state]
          properties:
            version: { const: proof.structural-inventory/v1 }
            authority:
              type: object
              additionalProperties: false
              required: [version, project_id, subject_fingerprint, code_fingerprint, tests_fingerprint]
              properties:
                version: { const: proof.project-authority/v1 }
                project_id: { type: string, minLength: 1 }
                subject_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                code_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                tests_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            sorted_paths: { type: array, items: { type: string, minLength: 1 } }
            sorted_module_paths: { type: [array, 'null'], items: { type: string, minLength: 1 } }
            boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            input_state:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [owner_kind, owner_id, input_kind, path, file_hash]
                properties:
                  owner_kind: { const: onboarding_structural_inventory }
                  owner_id: { type: string, minLength: 1 }
                  input_kind: { type: string, minLength: 1 }
                  path: { type: string, minLength: 1 }
                  file_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        catalog:
          type: object
          additionalProperties: false
          required: [version, project_id, components]
          properties:
            version: { const: proof.component-catalog-candidate/v1 }
            project_id: { type: string, minLength: 1 }
            components:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: object
                additionalProperties: false
                required: [id, responsibility, owned_paths]
                properties:
                  id: { type: string, minLength: 1 }
                  responsibility: { type: string, minLength: 1 }
                  owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                  dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                  entry_points: { type: array, items: { type: string, minLength: 1 } }
                  state_effects: { type: array, items: { type: string, minLength: 1 } }
                  interfaces: { type: array, items: {} }
                  uncertainty: { type: array, items: { type: string, minLength: 1 } }
        work_items:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [version, project_id, component_id, sorted_owned_paths, sorted_dependency_closure, proof_path_mapping, proof_input_state, proof_component_subject]
            properties:
              version: { const: reqproof.onboarding-component-work-item/v1 }
              project_id: { type: string, minLength: 1 }
              component_id: { type: string, minLength: 1 }
              sorted_owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
              sorted_dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
              proof_path_mapping:
                type: object
                additionalProperties: false
                required: [paths, components, owner, risk_tier, enforcement]
                properties:
                  paths: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
                  components: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
                  owner: { const: onboard }
                  risk_tier: { const: 0 }
                  enforcement: { const: soft }
              proof_input_state:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [owner_kind, owner_id, input_kind, path, file_hash]
                  properties:
                    owner_kind: { const: onboarding_component }
                    owner_id: { type: string, minLength: 1 }
                    input_kind: { type: string, minLength: 1 }
                    path: { type: string, minLength: 1 }
                    file_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
              proof_component_subject:
                type: object
                additionalProperties: false
                required: [version, project_id, component_id, sorted_owned_paths, sorted_dependency_closure, fingerprint]
                properties:
                  version: { const: proof.component-subject/v1 }
                  project_id: { type: string, minLength: 1 }
                  component_id: { type: string, minLength: 1 }
                  sorted_owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                  sorted_dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                  fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        receipt:
          type: object
          additionalProperties: false
          required: [version, decision, project_id, project_fingerprint, boundary_fingerprint, inventory_claim_id, catalog_claim_id, admission_candidate_id, admission_result_digest, admission_receipt_id, component_authorities, project_lineage, receipt_id]
          properties:
            version: { const: proof.catalog-revalidation-receipt/v2 }
            decision: { const: accepted }
            project_id: { type: string, minLength: 1 }
            project_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            inventory_claim_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            catalog_claim_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            admission_candidate_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            admission_result_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            admission_receipt_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            component_authorities:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: object
                additionalProperties: false
                required: [component_id, work_item_digest, subject]
                properties:
                  component_id: { type: string, minLength: 1 }
                  work_item_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                  subject:
                    type: object
                    additionalProperties: false
                    required: [version, project_id, component_id, sorted_owned_paths, sorted_dependency_closure, fingerprint]
                    properties:
                      version: { const: proof.component-subject/v1 }
                      project_id: { type: string, minLength: 1 }
                      component_id: { type: string, minLength: 1 }
                      sorted_owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                      sorted_dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                      fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            project_lineage:
              type: [object, 'null']
              additionalProperties: false
              required: [version, fingerprint, object_format, baseline_revision]
              properties:
                version: { const: proof.git-project-lineage-binding/v1 }
                fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                object_format: { enum: [sha1, sha256] }
                baseline_revision: { type: string, pattern: "^(sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$" }
            receipt_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
  proof.project_reconciliation_receipt@1:
    schema:
      type: object
      additionalProperties: false
      required:
        - version
        - project_authority
        - catalog_revalidation_receipt
        - component_admissions
        - covered_work_item_digests
        - receipt_id
      properties:
        version: { const: proof.project-reconciliation-receipt/v1 }
        project_authority:
          type: object
          additionalProperties: false
          required: [version, project_id, subject_fingerprint, code_fingerprint, tests_fingerprint]
          properties:
            version: { const: proof.project-authority/v1 }
            project_id: { type: string, minLength: 1 }
            subject_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            code_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            tests_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        catalog_revalidation_receipt:
          type: object
          additionalProperties: false
          required: [version, decision, project_id, project_fingerprint, boundary_fingerprint, inventory_claim_id, catalog_claim_id, admission_candidate_id, admission_result_digest, admission_receipt_id, component_authorities, project_lineage, receipt_id]
          properties:
            version: { const: proof.catalog-revalidation-receipt/v2 }
            decision: { const: accepted }
            project_id: { type: string, minLength: 1 }
            project_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            inventory_claim_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            catalog_claim_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            admission_candidate_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            admission_result_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            admission_receipt_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            component_authorities:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: object
                additionalProperties: false
                required: [component_id, work_item_digest, subject]
                properties:
                  component_id: { type: string, minLength: 1 }
                  work_item_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                  subject:
                    type: object
                    additionalProperties: false
                    required: [version, project_id, component_id, sorted_owned_paths, sorted_dependency_closure, fingerprint]
                    properties:
                      version: { const: proof.component-subject/v1 }
                      project_id: { type: string, minLength: 1 }
                      component_id: { type: string, minLength: 1 }
                      sorted_owned_paths: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                      sorted_dependency_closure: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
                      fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            project_lineage:
              type: [object, 'null']
              additionalProperties: false
              required: [version, fingerprint, object_format, baseline_revision]
              properties:
                version: { const: proof.git-project-lineage-binding/v1 }
                fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                object_format: { enum: [sha1, sha256] }
                baseline_revision: { type: string, pattern: "^(sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$" }
            receipt_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        component_admissions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [component_id, work_item_digest, candidate_id, result_digest, operational_scope_digest]
            properties:
              component_id: { type: string, minLength: 1 }
              work_item_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
              candidate_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
              result_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
              operational_scope_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        covered_work_item_digests:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        receipt_id: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
  component.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [components]
      properties:
        components:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [version, project_id, component_id, sorted_owned_paths, sorted_dependency_closure, proof_path_mapping, proof_input_state, proof_component_subject, authority]
            properties:
              version: { const: reqproof.onboarding-component-work-item/v1 }
              project_id: { type: string, minLength: 1 }
              component_id: { type: string, minLength: 1 }
              sorted_owned_paths: { type: array, uniqueItems: true, items: { type: string } }
              sorted_dependency_closure: { type: array, uniqueItems: true, items: { type: string } }
              proof_path_mapping:
                type: object
                additionalProperties: false
                required: [paths, components, owner, risk_tier, enforcement]
                properties:
                  paths: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
                  components: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
                  owner: { const: onboard }
                  risk_tier: { const: 0 }
                  enforcement: { const: soft }
              proof_input_state:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [owner_kind, owner_id, input_kind, path, file_hash]
                  properties:
                    owner_kind: { const: onboarding_component }
                    owner_id: { type: string, minLength: 1 }
                    input_kind: { type: string, minLength: 1 }
                    path: { type: string, minLength: 1 }
                    file_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
              proof_component_subject:
