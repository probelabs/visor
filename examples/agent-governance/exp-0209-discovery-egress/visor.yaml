# EXP-0209 discovery egress.  This is the operational graph source of truth.
# The project catalog is one manually selected project.  Its discovery
# subgraph is allowed to fan out only after Proof candidate admission and a
# current Proof catalog-revalidation receipt.  Component boundaries are model
# output and are intentionally absent from this authored file.
version: "1.0"
max_parallelism: 3
workspace:
  enabled: false

claim_types:
  project.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [project_id, root]
            properties:
              project_id: { type: string, minLength: 1 }
              root: { type: string, minLength: 1 }
  project.discovery_item@1:
    schema:
      type: object
      additionalProperties: false
      required: [project_id, root]
      properties:
        project_id: { type: string, minLength: 1 }
        root: { type: string, minLength: 1 }
  proof.candidate@1:
    schema:
      type: object
      additionalProperties: false
      required: [components]
      properties:
        components:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [component_id]
            properties:
              component_id: { type: string, minLength: 1 }
              responsibility: { type: string }
  proof.admitted_receipt@1:
    schema: { type: object }
  proof.structural_inventory@1:
    schema:
      type: object
      additionalProperties: false
      required: [version, project_id, revision_fingerprint, boundary_fingerprint, source_paths, package_identities]
      properties:
        version: { const: proof.structural-inventory/v1 }
        project_id: { type: string, minLength: 1 }
        revision_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        source_paths: { type: array, minItems: 1, items: { type: string } }
        package_identities: { type: array, minItems: 1, items: { type: string } }
  proof.catalog_revalidation@1:
    schema:
      type: object
      additionalProperties: false
      required:
        - version
        - status
        - structural_inventory_claim_id
        - candidate_claim_id
        - admission_receipt_claim_id
        - candidate_payload_fingerprint
        - revision_fingerprint
        - boundary_fingerprint
        - work_items
      properties:
        version: { const: proof.catalog-revalidation/v1 }
        status: { const: ACCEPTED }
        structural_inventory_claim_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        candidate_claim_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        admission_receipt_claim_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        candidate_payload_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        revision_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        boundary_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        work_items: { type: array, minItems: 2, maxItems: 4 }
  component.catalog@1:
    schema:
      type: object
      additionalProperties: false
      required: [components]
      properties:
        components:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
              - project_id
              - component_id
              - sorted_owned_paths
              - sorted_dependency_closure
              - proof_path_mapping
              - proof_input_state
              - proof_component_subject
              - authority
            properties:
              project_id: { type: string, minLength: 1 }
              component_id: { type: string, minLength: 1 }
              sorted_owned_paths: { type: array, items: { type: string } }
              sorted_dependency_closure: { type: array, items: { type: string } }
              proof_path_mapping: { type: array }
              proof_input_state: { type: array }
              proof_component_subject: { type: object }
              authority: { type: object }
  component.work_item@1:
    schema:
      type: object
      additionalProperties: false
      required:
        - project_id
        - component_id
        - sorted_owned_paths
        - sorted_dependency_closure
        - proof_path_mapping
        - proof_input_state
        - proof_component_subject
        - authority
      properties:
        project_id: { type: string, minLength: 1 }
        component_id: { type: string, minLength: 1 }
        sorted_owned_paths: { type: array, items: { type: string } }
        sorted_dependency_closure: { type: array, items: { type: string } }
        proof_path_mapping: { type: array }
        proof_input_state: { type: array }
        proof_component_subject: { type: object }
        authority: { type: object }
  component.onboarded@1:
    schema:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: onboarded }

checks:
  project:
    type: memory
    operation: set
    key: project-catalog
    value:
      projects:
        - project_id: journalservice
          root: .
    emits:
      - claim: project.catalog@1
        from: output
    expand:
      claim: project.catalog@1
      template: discover-project
      items_pointer: /projects
      key_pointer: /project_id
      item_claim: project.discovery_item@1

subgraphs:
  discover-project:
    input: { name: project, claim: project.discovery_item@1 }
    checks:
      structural_inventory:
        type: proof-structural-inventory
        consumes:
          - { claim: project.discovery_item@1, as: project }
        emits:
          - { claim: proof.structural_inventory@1, from: output }
      inspect:
        type: governed-proof-inspect
        message: Execute the bound Proof discovery role and return only canonical JSON.
        instructions: Discover the project's independently onboardable components; do not invent files.
        profile: luna-xhigh-readonly-v1
        invocation:
          role_id: onboard
          stance: owner
          subject:
            kind: project
            id: journalservice
            fingerprint: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          output_schema_id: proof.component-catalog-candidate@1
          output_schema: 
        invocation_digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        result_schema: '{"type":"object","additionalProperties":false,"required":["components"],"properties":{"components":{"type":"array","minItems":2,"maxItems":4,"items":{"type":"object","additionalProperties":false,"required":["component_id","responsibility"],"properties":{"component_id":{"type":"string","minLength":1},"responsibility":{"type":"string","minLength":1}}}}}}'
        consumes:
          - { claim: project.discovery_item@1, as: project }
          - { claim: proof.structural_inventory@1, as: current_inventory }
        emits:
          - { claim: proof.candidate@1, from: output }
      proof_admit:
        type: proof-admit
        consumes:
          - { claim: proof.candidate@1, as: candidate }
        emits:
          - { claim: proof.admitted_receipt@1, from: output }
      verify:
        type: noop
        consumes:
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
      revalidate_catalog:
        type: proof-catalog-revalidate
        depends_on: [verify]
        consumes:
          - { claim: proof.structural_inventory@1, as: current_inventory }
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
        emits:
          - { claim: proof.catalog_revalidation@1, from: output }
      materialize_catalog:
        type: proof-admitted-catalog
        consumes:
          - { claim: proof.structural_inventory@1, as: current_inventory }
          - { claim: proof.candidate@1, as: candidate }
          - { claim: proof.admitted_receipt@1, as: receipt }
          - { claim: proof.catalog_revalidation@1, as: current_revalidation }
        emits:
          - { claim: component.catalog@1, from: output }
        expand:
          claim: component.catalog@1
          template: onboard-component
          items_pointer: /components
          key_pointer: /component_id
          item_claim: component.work_item@1

  onboard-component:
    input: { name: component, claim: component.work_item@1 }
    checks:
      inspect:
        type: memory
        operation: set
        key: component-onboarded
        value: { status: onboarded }
        consumes:
          - { claim: component.work_item@1, as: component }
        emits:
          - { claim: component.onboarded@1, from: output }
