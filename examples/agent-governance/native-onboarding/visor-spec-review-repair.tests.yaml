version: "1.0"
extends: "visor-spec-review-repair.yaml"

tests:
  defaults:
    strict: true
    ai_provider: codex
    fail_on_unexpected_calls: true
    frontends: []

  cases:
    - name: native-spec-review-repair-failure-feedback
      description: |
        A focused audit failure routes back to the same component author. The
        second author prompt contains the exact failed audit receipt through
        output history, then the second bounded audit passes.
      event: manual
      fixture: local.minimal
      workflow_input:
        manifest_path: /tmp/mock-manifest.json
        component_id: component-a
        requirement_ids: [REQ-A]
        checkout:
          success: true
          path: /tmp/mock-checkout
          ref: refs/heads/mock
          commit: 0123456789abcdef0123456789abcdef01234567
          worktree_id: mock-a
          repository: fixture
          is_worktree: true
        role_text: BUILTIN SPEC REVIEW ROLE
        prior_audit_receipt:
          status: failed
          component_id: component-a
          requirement_ids: [REQ-A]
          receipt_path: spec-review/repair/repair-run-1/prior-audit.json
          failure: initial-graph-failure-token
        repair_run_id: repair-run-1
      mocks:
        repair-input:
          success: true
          is_worktree: true
          path: /tmp/mock-checkout
          ref: refs/heads/mock
          commit: 0123456789abcdef0123456789abcdef01234567
          worktree_id: mock-a
          repository: fixture
        "repair[]":
          - pass: 1
            summary: Authored the initial component review repair.
          - pass: 2
            summary: Applied the bounded repair from the failed audit receipt.
        "audit[]":
          - stdout: >-
              {"status":"failed","component_id":"component-a","requirement_ids":["REQ-A"],"attempt":1,"receipt_path":"spec-review/repair/repair-run-1/audit-attempt-1.json","failure":"repair-audit-failure-token","report":{"status":"failed","summary":"focused audit failed","exit_code":2},"exit_code":2}
            stderr: ""
            exit_code: 1
          - stdout: >-
              {"status":"pass","component_id":"component-a","requirement_ids":["REQ-A"],"attempt":2,"receipt_path":"spec-review/repair/repair-run-1/audit-attempt-2.json","failure":null,"report":{"status":"pass","summary":"focused audit passed","exit_code":0},"exit_code":0}
            stderr: ""
            exit_code: 0
      expect:
        calls:
          - {step: repair-input, exactly: 1}
          - {step: repair, exactly: 2}
          - {step: audit, exactly: 2}
        outputs:
          - {step: repair-input, path: success, equals: true}
          - {step: audit, index: first, path: attempt, equals: 1}
          - {step: audit, index: first, path: status, equals: failed}
          - {step: audit, index: first, path: receipt_path, equals: spec-review/repair/repair-run-1/audit-attempt-1.json}
          - {step: audit, index: last, path: attempt, equals: 2}
          - {step: audit, index: last, path: status, equals: pass}
          - {step: audit, index: last, path: receipt_path, equals: spec-review/repair/repair-run-1/audit-attempt-2.json}
        prompts:
          - step: repair
            index: first
            contains:
              - initial-graph-failure-token
              - prior-audit.json
            not_contains:
              - repair-audit-failure-token
          - step: repair
            index: 1
            contains:
              - repair-audit-failure-token
              - audit-attempt-1.json

    - name: native-spec-review-repair-bounded-nonconvergence
      description: |
        Repeated focused audit failures consume the two-attempt audit budget
        and remain terminal instead of routing forever.
      event: manual
      fixture: local.minimal
      workflow_input:
        manifest_path: /tmp/mock-manifest.json
        component_id: component-a
        requirement_ids: [REQ-A]
        checkout:
          success: true
          path: /tmp/mock-checkout
          ref: refs/heads/mock
          commit: 0123456789abcdef0123456789abcdef01234567
          worktree_id: mock-a
          repository: fixture
          is_worktree: true
        role_text: BUILTIN SPEC REVIEW ROLE
        prior_audit_receipt:
          status: failed
          component_id: component-a
          requirement_ids: [REQ-A]
          receipt_path: spec-review/repair/repair-run-1/prior-audit.json
          failure: initial-graph-failure-token
        repair_run_id: repair-run-1
      mocks:
        repair-input:
          success: true
          is_worktree: true
          path: /tmp/mock-checkout
          ref: refs/heads/mock
          commit: 0123456789abcdef0123456789abcdef01234567
          worktree_id: mock-a
          repository: fixture
        "repair[]":
          - pass: 1
            summary: Authored the initial component review repair.
          - pass: 2
            summary: Repeated the bounded repair after another failed audit.
        "audit[]":
          - stdout: >-
              {"status":"failed","component_id":"component-a","requirement_ids":["REQ-A"],"attempt":1,"receipt_path":"spec-review/repair/repair-run-1/audit-attempt-1.json","failure":"repair-audit-failure-token","report":{"status":"failed","summary":"focused audit failed","exit_code":2},"exit_code":2}
            stderr: ""
            exit_code: 1
          - stdout: >-
              {"status":"failed","component_id":"component-a","requirement_ids":["REQ-A"],"attempt":2,"receipt_path":"spec-review/repair/repair-run-1/audit-attempt-2.json","failure":"repair-audit-failure-token-2","report":{"status":"failed","summary":"focused audit still failed","exit_code":2},"exit_code":1}
            stderr: ""
            exit_code: 1
      expect:
        calls:
          - {step: repair-input, exactly: 1}
          - {step: repair, exactly: 2}
          - {step: audit, exactly: 2}
        outputs:
          - {step: audit, index: last, path: attempt, equals: 2}
          - {step: audit, index: last, path: status, equals: failed}
        fail:
          message_contains: max
