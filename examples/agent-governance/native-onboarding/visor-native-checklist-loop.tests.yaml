version: "1.0"
extends: "visor-native-checklist-loop.yaml"

tests:
  defaults:
    strict: true
    ai_provider: mock
    fail_on_unexpected_calls: true
    frontends: []

  cases:
    - name: native-checklist-bootstrap-reaches-author
      description: |
        A fresh subject has no Proof project. The ordinary native-state check
        supplies bootstrap input, the author runs once, and independent audit
        plus native checklist readback complete the bounded graph.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          bootstrap_required: true
        author:
          pass: 1
          summary: bootstrapped the native Proof project and followed its current role
        proof-audit:
          stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
          stderr: ""
          exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 1}
          - {step: proof-audit, exactly: 1}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            contains:
              - bootstrap_required
              - native Proof
              - role show
              - /tmp/native-checklist-target
            not_contains:
              - AUDIT_REPAIR_TOKEN
        outputs:
          - {step: native-state, path: bootstrap_required, equals: true}
          - {step: native-completion, path: ok, equals: true}

    - name: native-checklist-inactive-show-bootstraps-author
      description: |
        A present but inactive native checklist is valid bootstrap input. The
        raw Proof show is preserved and the author is still selected.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: false
          ok: false
          steps: []
        author:
          pass: 1
          summary: initialized the inactive native checklist
        proof-audit:
          stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
          stderr: ""
          exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 1}
          - {step: proof-audit, exactly: 1}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            contains: [inactive, native Proof]

    - name: native-checklist-audit-failure-feedback
      description: |
        A failed independent Proof audit routes the exact raw failure back to
        the same author. The second audit passes and the native readback is ok.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: completed the current native role work}
          - {pass: 2, summary: repaired the exact independent audit finding}
        proof-audit[]:
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            not_contains: [audit.stdout.jsonl]
          - step: author
            index: 1
            contains: [stdout_artifact, attempt-1/audit.stdout.jsonl]
        outputs:
          - {step: proof-audit, index: last, path: terminal.status, equals: pass}
          - {step: native-completion, path: ok, equals: true}

    - name: native-checklist-completion-failure-feedback
      description: |
        A native checklist readback that remains not-ok routes its exact result
        to the author once, then converges on the second independent readback.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: completed native work before readback}
          - {pass: 2, summary: repaired the native completion finding}
        proof-audit[]:
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
        native-completion[]:
          - schema_version: proof.checklist.show.v1
            checklist: onboard_v1
            active: true
            ok: false
            failure: COMPLETION_REPAIR_TOKEN
            steps: []
          - schema_version: proof.checklist.show.v1
            checklist: onboard_v1
            active: true
            ok: true
            steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 2}
        prompts:
          - step: author
            index: 1
            contains: [COMPLETION_REPAIR_TOKEN]
        outputs:
          - {step: native-completion, index: first, path: ok, equals: false}
          - {step: native-completion, index: last, path: ok, equals: true}

    - name: native-checklist-bounded-nonconvergence
      description: |
        Two exact independent audit failures consume the YAML-owned retry
        budget and remain terminal instead of looping indefinitely.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: attempted current native role work}
          - {pass: 2, summary: attempted bounded repair from audit feedback}
        proof-audit[]:
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"failed"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"failed"}}'
            stderr: ""
            exit_code: 0
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 0}
        prompts:
          - step: author
            index: 1
            contains: [stdout_artifact, attempt-1/audit.stdout.jsonl]
        fail:
          message_contains: max

    - name: native-checklist-ok-skips-author-but-repairs-audit
      description: |
        An already-native-ok checklist skips the initial author, but an
        independent audit failure still re-enters that author with exact
        feedback before the final readback.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
        author:
          pass: 1
          summary: repaired the independent audit finding only
        proof-audit[]:
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 1}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            contains: [stdout_artifact, attempt-1/audit.stdout.jsonl]
        outputs:
          - {step: native-state, path: ok, equals: true}
          - {step: author, path: summary, equals: repaired the independent audit finding only}
          - {step: native-completion, path: ok, equals: true}

    - name: native-checklist-large-audit-receipt-stays-bounded
      description: |
        A pass-shaped nonzero native audit writes a large JSONL artifact. The
        bounded terminal receipt routes the author without injecting the bulk
        audit stream into its prompt; the next malformed exit-0 stream also
        remains terminal.
      event: manual
      fixture: local.minimal
      env:
        TARGET_ROOT: /tmp/visor-native-large-audit-target
        PROOF_BIN: /tmp/visor-native-large-audit-proof.sh
      hooks:
        before:
          exec: |
            mkdir -p /tmp/visor-native-large-audit-target
            node <<'NODE'
            const fs = require('fs');
            fs.writeFileSync('/tmp/visor-native-large-audit-proof.sh', `#!/bin/sh
            if [ -f /tmp/visor-native-large-audit-target/audit-count ]; then
              printf '%s\\n' 'not-json-terminal-row';
              exit 0;
            fi
            touch /tmp/visor-native-large-audit-target/audit-count
            exec node - <<'INNER'
            const bulk = 'LARGE_AUDIT_BULK_SENTINEL'.repeat(10000);
            process.stdout.write(JSON.stringify({event: 'finding', detail: bulk}) + '\\n');
            process.stdout.write(JSON.stringify({event: 'check_done', check: 'audit', status: 'pass', failure: 'LARGE_AUDIT_RECEIPT'}) + '\\n');
            process.exit(1);
            INNER
            `);
            fs.chmodSync('/tmp/visor-native-large-audit-proof.sh', 0o755);
            NODE
        after:
          exec: rm -rf /tmp/visor-native-large-audit-target /tmp/visor-native-large-audit-proof.sh
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: 0000000000000000000000000000000000000000
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: bounded initial native role work}
          - {pass: 2, summary: bounded repair from artifact-backed audit receipt}
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 0}
        prompts:
          - step: author
            index: first
            not_contains: [LARGE_AUDIT_RECEIPT, LARGE_AUDIT_BULK_SENTINEL]
          - step: author
            index: 1
            contains: [stdout_artifact, audit.stdout.jsonl]
            not_contains: [LARGE_AUDIT_BULK_SENTINEL]
        fail:
          message_contains: max

# The native test harness injects its mock provider and disables tools. Keep
# these seven deterministic cases focused on graph/routing/history semantics;
# the production YAML above is validated separately with the isolated-writer
# profile intact.
checks:
  author:
    ai:
      codex_execution_profile: null
      codex_working_directory_from: null
