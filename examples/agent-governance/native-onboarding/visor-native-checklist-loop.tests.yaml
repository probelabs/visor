version: "1.0"
extends: "visor-native-checklist-loop.yaml"

tests:
  defaults:
    strict: true
    ai_provider: mock
    fail_on_unexpected_calls: true
    frontends: []

  cases:
    - name: native-checklist-bootstrap-reaches-author
      description: |
        A fresh subject has no Proof project. The ordinary native-state check
        supplies bootstrap input, the author runs once, and independent audit
        plus native checklist readback complete the bounded graph.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          bootstrap_required: true
        author:
          pass: 1
          summary: bootstrapped the native Proof project and followed its current role
        proof-audit:
          stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
          stderr: ""
          exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 1}
          - {step: proof-audit, exactly: 1}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            contains:
              - bootstrap_required
              - native Proof
              - role show
              - /tmp/native-checklist-target
            not_contains:
              - AUDIT_REPAIR_TOKEN
        outputs:
          - {step: native-state, path: bootstrap_required, equals: true}
          - {step: native-completion, path: ok, equals: true}

    - name: native-checklist-inactive-show-bootstraps-author
      description: |
        A present but inactive native checklist is valid bootstrap input. The
        raw Proof show is preserved and the author is still selected.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: false
          ok: false
          steps: []
        author:
          pass: 1
          summary: initialized the inactive native checklist
        proof-audit:
          stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
          stderr: ""
          exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 1}
          - {step: proof-audit, exactly: 1}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            contains: [inactive, native Proof]

    - name: native-checklist-audit-failure-feedback
      description: |
        A failed independent Proof audit routes the exact raw failure back to
        the same author. The second audit passes and the native readback is ok.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: completed the current native role work}
          - {pass: 2, summary: repaired the exact independent audit finding}
        proof-audit[]:
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            not_contains: [audit.stdout.jsonl]
          - step: author
            index: 1
            contains: [stdout_artifact, attempt-1/audit.stdout.jsonl]
        outputs:
          - {step: proof-audit, index: last, path: terminal.status, equals: pass}
          - {step: native-completion, path: ok, equals: true}

    - name: native-checklist-completion-failure-feedback
      description: |
        A native checklist readback that remains not-ok routes its exact result
        to the author once, then converges on the second independent readback.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: completed native work before readback}
          - {pass: 2, summary: repaired the native completion finding}
        proof-audit[]:
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
        native-completion[]:
          - schema_version: proof.checklist.show.v1
            checklist: onboard_v1
            active: true
            ok: false
            failure: COMPLETION_REPAIR_TOKEN
            steps: []
          - schema_version: proof.checklist.show.v1
            checklist: onboard_v1
            active: true
            ok: true
            steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 2}
        prompts:
          - step: author
            index: 1
            contains: [COMPLETION_REPAIR_TOKEN]
        outputs:
          - {step: native-completion, index: first, path: ok, equals: false}
          - {step: native-completion, index: last, path: ok, equals: true}

    - name: native-checklist-bounded-nonconvergence
      description: |
        Two exact independent audit failures consume the YAML-owned retry
        budget and remain terminal instead of looping indefinitely.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: attempted current native role work}
          - {pass: 2, summary: attempted bounded repair from audit feedback}
        proof-audit[]:
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"failed"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"failed"}}'
            stderr: ""
            exit_code: 0
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 0}
        prompts:
          - step: author
            index: 1
            contains: [stdout_artifact, attempt-1/audit.stdout.jsonl]
        fail:
          message_contains: max

    - name: native-checklist-ok-skips-author-but-repairs-audit
      description: |
        An already-native-ok checklist skips the initial author, but an
        independent audit failure still re-enters that author with exact
        feedback before the final readback.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
        author:
          pass: 1
          summary: repaired the independent audit finding only
        proof-audit[]:
          - stdout: '{"audit_exit_code":1,"stdout_artifact":".visor-native-checklist-audit/attempt-1/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-1/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
          - stdout: '{"audit_exit_code":0,"stdout_artifact":".visor-native-checklist-audit/attempt-2/audit.stdout.jsonl","stderr_artifact":".visor-native-checklist-audit/attempt-2/audit.stderr.log","terminal":{"event":"check_done","check":"audit","status":"pass"}}'
            stderr: ""
            exit_code: 0
        native-completion:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: true
          steps: []
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 1}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 1}
        prompts:
          - step: author
            index: first
            contains: [stdout_artifact, attempt-1/audit.stdout.jsonl]
        outputs:
          - {step: native-state, path: ok, equals: true}
          - {step: author, path: summary, equals: repaired the independent audit finding only}
          - {step: native-completion, path: ok, equals: true}

    - name: native-checklist-large-audit-receipt-stays-bounded
      description: |
        A pass-shaped nonzero native audit writes a large JSONL artifact. The
        bounded terminal receipt routes the author without injecting the bulk
        audit stream into its prompt; the next malformed exit-0 stream also
        remains terminal.
      event: manual
      fixture: local.minimal
      env:
        TARGET_ROOT: /tmp/visor-native-large-audit-target
        PROOF_BIN: /tmp/visor-native-large-audit-proof.sh
      hooks:
        before:
          exec: |
            mkdir -p /tmp/visor-native-large-audit-target
            node <<'NODE'
            const fs = require('fs');
            fs.writeFileSync('/tmp/visor-native-large-audit-proof.sh', `#!/bin/sh
            if [ -f /tmp/visor-native-large-audit-target/audit-count ]; then
              printf '%s\\n' 'not-json-terminal-row';
              exit 0;
            fi
            touch /tmp/visor-native-large-audit-target/audit-count
            exec node - <<'INNER'
            const bulk = 'LARGE_AUDIT_BULK_SENTINEL'.repeat(10000);
            process.stdout.write(JSON.stringify({event: 'finding', detail: bulk}) + '\\n');
            process.stdout.write(JSON.stringify({event: 'check_done', check: 'audit', status: 'pass', failure: 'LARGE_AUDIT_RECEIPT'}) + '\\n');
            process.exit(1);
            INNER
            `);
            fs.chmodSync('/tmp/visor-native-large-audit-proof.sh', 0o755);
            NODE
        after:
          exec: rm -rf /tmp/visor-native-large-audit-target /tmp/visor-native-large-audit-proof.sh
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
        author[]:
          - {pass: 1, summary: bounded initial native role work}
          - {pass: 2, summary: bounded repair from artifact-backed audit receipt}
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: author, exactly: 2}
          - {step: proof-audit, exactly: 2}
          - {step: native-completion, exactly: 0}
        prompts:
          - step: author
            index: first
            not_contains: [LARGE_AUDIT_RECEIPT, LARGE_AUDIT_BULK_SENTINEL]
          - step: author
            index: 1
            contains: [stdout_artifact, audit.stdout.jsonl]
            not_contains: [LARGE_AUDIT_BULK_SENTINEL]
        fail:
          message_contains: max

    - name: native-spec-review-batches-preserve-denominator
      description: |
        An active Proof spec-review role is expanded through the standard
        project/role/component/batch graph. Six requirements become two
        deterministic batches (5 + 1), each writer receives a compact fresh
        preflight receipt, and the receipt contract permits needs_changes
        findings as execution data; this green fixture uses no unresolved
        finding, so only the post-batch native finisher may confirm the role.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
          steps: []
          steps_pending: 1
          next: {step_id: spec-review-7, role: spec-review}
        native-project-dispatch:
          projects:
            - id: native-project
              target:
                success: true
                is_worktree: true
                path: /tmp/native-checklist-target
                commit: '0000000000000000000000000000000000000000'
                worktree_id: mock-target
                repository: /tmp/native-checklist-target
              state:
                schema_version: proof.checklist.show.v1
                checklist: onboard_v1
                active: true
                ok: false
                steps: []
                steps_pending: 1
                next: {step_id: spec-review-7, role: spec-review}
        native-role-dispatch:
          total_roles: 1
          roles:
            - id: spec-review-7
              mode: spec-review
              step_id: spec-review-7
              role: spec-review
              target:
                success: true
                is_worktree: true
                path: /tmp/native-checklist-target
                commit: '0000000000000000000000000000000000000000'
                worktree_id: mock-target
                repository: /tmp/native-checklist-target
              total_requirements: 6
              requirements:
                - {id: req-a, component: component-a}
                - {id: req-b, component: component-a}
                - {id: req-c, component: component-a}
                - {id: req-d, component: component-a}
                - {id: req-e, component: component-a}
                - {id: req-f, component: component-a}
        native-role-barrier: {status: drained}
        enumerate-native-components:
          total_components: 1
          total_requirements: 6
          step_id: spec-review-7
          role: spec-review
          target:
            success: true
            is_worktree: true
            path: /tmp/native-checklist-target
            commit: '0000000000000000000000000000000000000000'
            worktree_id: mock-target
            repository: /tmp/native-checklist-target
          components:
            - id: component-a
              component_id: component-a
              requirement_ids: [req-a, req-b, req-c, req-d, req-e, req-f]
              requirements:
                - {id: req-a, component: component-a}
                - {id: req-b, component: component-a}
                - {id: req-c, component: component-a}
                - {id: req-d, component: component-a}
                - {id: req-e, component: component-a}
                - {id: req-f, component: component-a}
              total_requirements: 6
              batch_count: 2
              step_id: spec-review-7
              role: spec-review
              target:
                success: true
                is_worktree: true
                path: /tmp/native-checklist-target
                commit: '0000000000000000000000000000000000000000'
                worktree_id: mock-target
                repository: /tmp/native-checklist-target
        component-barrier: {status: drained}
        enumerate-native-batches:
          total_batches: 2
          component_requirement_count: 6
          component_id: component-a
          step_id: spec-review-7
          role: spec-review
          target:
            success: true
            is_worktree: true
            path: /tmp/native-checklist-target
            commit: '0000000000000000000000000000000000000000'
            worktree_id: mock-target
            repository: /tmp/native-checklist-target
          batches:
            - id: 'component-a:batch:1'
              component_id: component-a
              requirement_ids: [req-a, req-b, req-c, req-d, req-e]
              all_requirement_ids: [req-a, req-b, req-c, req-d, req-e, req-f]
              requirements:
                - {id: req-a, component: component-a}
                - {id: req-b, component: component-a}
                - {id: req-c, component: component-a}
                - {id: req-d, component: component-a}
                - {id: req-e, component: component-a}
              component_requirement_count: 6
              batch_requirement_count: 5
              batch_index: 1
              total_batches: 2
              step_id: spec-review-7
              role: spec-review
              target:
                success: true
                is_worktree: true
                path: /tmp/native-checklist-target
                commit: '0000000000000000000000000000000000000000'
                worktree_id: mock-target
                repository: /tmp/native-checklist-target
            - id: 'component-a:batch:2'
              component_id: component-a
              requirement_ids: [req-f]
              all_requirement_ids: [req-a, req-b, req-c, req-d, req-e, req-f]
              requirements: [{id: req-f, component: component-a}]
              component_requirement_count: 6
              batch_requirement_count: 1
              batch_index: 2
              total_batches: 2
              step_id: spec-review-7
              role: spec-review
              target:
                success: true
                is_worktree: true
                path: /tmp/native-checklist-target
                commit: '0000000000000000000000000000000000000000'
                worktree_id: mock-target
                repository: /tmp/native-checklist-target
        validate-batch-current[]:
          - {batch_id: 'component-a:batch:1', component_id: component-a, step_id: spec-review-7, role: spec-review, requirement_ids: [req-a, req-b, req-c, req-d, req-e], all_requirement_ids: [req-a, req-b, req-c, req-d, req-e, req-f], component_requirement_count: 6, batch_requirement_count: 5, context_ids: [req-a, req-b, req-c, req-d, req-e]}
          - {batch_id: 'component-a:batch:2', component_id: component-a, step_id: spec-review-7, role: spec-review, requirement_ids: [req-f], all_requirement_ids: [req-a, req-b, req-c, req-d, req-e, req-f], component_requirement_count: 6, batch_requirement_count: 1, context_ids: [req-f]}
        batch-binding[]:
          - {success: true, is_worktree: true, path: /tmp/native-checklist-target, commit: '0000000000000000000000000000000000000000', worktree_id: mock-target, repository: /tmp/native-checklist-target}
          - {success: true, is_worktree: true, path: /tmp/native-checklist-target, commit: '0000000000000000000000000000000000000000', worktree_id: mock-target, repository: /tmp/native-checklist-target}
        batch-author[]:
          - {batch_id: 'component-a:batch:1', opened_ids: [req-a, req-b, req-c, req-d, req-e], component_requirement_count: 6, batch_requirement_count: 5, findings: [], errors: [], execution_status: completed}
          - {batch_id: 'component-a:batch:2', opened_ids: [req-f], component_requirement_count: 6, batch_requirement_count: 1, findings: [], errors: [], execution_status: completed}
        batch-finished[]:
          - {batch_id: 'component-a:batch:1', status: completed, opened_ids: [req-a, req-b, req-c, req-d, req-e], component_requirement_count: 6, batch_requirement_count: 5}
          - {batch_id: 'component-a:batch:2', status: completed, opened_ids: [req-f], component_requirement_count: 6, batch_requirement_count: 1}
        component-finished: {component_id: component-a, status: completed}
        role-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        role-finisher: {step_id: spec-review-7, role: spec-review, execution_status: completed, confirmation_status: confirmed, errors: []}
        role-readback: {step_id: spec-review-7, role: spec-review, status: confirmed, checklist: {active: true, next: {step_id: next-step, role: onboard}, steps: [{step_id: spec-review-7, stored_status: confirmed, effective_status: confirmed}]}}
        role-finished: {role_id: spec-review-7, status: completed}
      expect:
        calls:
          - {step: target-binding, exactly: 1}
          - {step: native-state, exactly: 1}
          - {step: native-project-dispatch, exactly: 1}
          - {logical_step: native-role-dispatch, exactly: 1}
          - {logical_step: enumerate-native-components, exactly: 1}
          - {logical_step: enumerate-native-batches, exactly: 1}
          - {logical_step: validate-batch-current, exactly: 2}
          - {logical_step: batch-author, exactly: 2}
          - {logical_step: batch-finished, exactly: 2}
          - {logical_step: role-finisher, exactly: 1}
          - {logical_step: role-readback, exactly: 1}
          - {logical_step: role-finished, exactly: 1}
          - {logical_step: native-role-barrier, exactly: 1}
          - {logical_step: component-barrier, exactly: 1}
          - {logical_step: component-finished, exactly: 1}
          - {logical_step: batch-binding, exactly: 2}
          - {logical_step: role-binding, exactly: 1}
          - {step: author, exactly: 0}
          - {step: proof-audit, exactly: 0}
          - {step: native-completion, exactly: 0}
        prompts:
          - step: batch-author
            index: first
            contains: [exact denominator, needs_changes, checklist confirmation]
          - step: role-finisher
            index: first
            contains: [full exit, confirmation]
        outputs:
          - {step: batch-author, where: {path: batch_requirement_count, equals: 5}, path: batch_requirement_count, equals: 5}
          - {step: batch-author, where: {path: batch_requirement_count, equals: 1}, path: batch_requirement_count, equals: 1}
          - {step: role-finished, path: status, equals: completed}

    - name: native-non-review-next-uses-generic-author
      description: |
        A real native checklist next step with a non-review role keeps the
        existing generic author path and does not enter the spec-review graph.
      event: manual
      fixture: local.minimal
      mocks:
        target-binding:
          success: true
          is_worktree: true
          path: /tmp/native-checklist-target
          commit: '0000000000000000000000000000000000000000'
          worktree_id: mock-target
          repository: /tmp/native-checklist-target
        native-state:
          schema_version: proof.checklist.show.v1
          checklist: onboard_v1
          active: true
          ok: false
