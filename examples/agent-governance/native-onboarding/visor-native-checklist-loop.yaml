# Canonical native Proof onboarding loop.
#
# This is an ordinary Visor graph: the native checklist is the authority, the
# author is an editable Probe/Codex step, and the independent Proof audit and
# checklist readback are completion gates.  The single native goto is bounded
# by both limits below; exhaustion is a terminal failure, never approval.
version: "1.0"
ai_provider: codex
ai_model: gpt-5.6-luna
max_parallelism: 1
fail_fast: false

routing:
  max_loops: 1
limits:
  max_runs_per_check: 2
  max_workflow_depth: 1
workspace:
  enabled: false
  cleanup_on_exit: false

checks:
  target-binding:
    type: command
    timeout: 120000
    output_format: json
    schema:
      type: object
      additionalProperties: false
      required: [success, is_worktree, path, commit, worktree_id, repository]
      properties:
        success: {const: true}
        is_worktree: {const: true}
        path: {type: string, minLength: 1}
        commit: {type: string, pattern: '^[0-9a-f]{40,64}$'}
        worktree_id: {type: string, minLength: 1}
        repository: {type: string, minLength: 1}
    exec: |
      set -eu
      : "${TARGET_ROOT:?TARGET_ROOT is required}"
      TARGET_ROOT="$(cd "$TARGET_ROOT" && pwd -P)"
      test -d "$TARGET_ROOT"
      test "$(git -C "$TARGET_ROOT" rev-parse --is-inside-work-tree)" = true
      REPOSITORY="$(git -C "$TARGET_ROOT" rev-parse --show-toplevel)"
      test "$TARGET_ROOT" = "$REPOSITORY"
      COMMIT="$(git -C "$TARGET_ROOT" rev-parse HEAD)"
      GIT_DIR="$(git -C "$TARGET_ROOT" rev-parse --git-dir)"
      node - "$TARGET_ROOT" "$COMMIT" "$REPOSITORY" "$GIT_DIR" <<'NODE'
      const [path, commit, repository, worktree_id] = process.argv.slice(2);
      process.stdout.write(JSON.stringify({
        success: true,
        is_worktree: true,
        path,
        commit,
        worktree_id,
        repository,
      }));
      NODE

  native-state:
    type: command
    depends_on: [target-binding]
    timeout: 120000
    output_format: json
    schema:
      oneOf:
        - type: object
          additionalProperties: false
          required: [bootstrap_required]
          properties:
            bootstrap_required: {const: true}
        - type: object
          required: [schema_version, checklist, active, ok, steps]
          properties:
            schema_version: {const: proof.checklist.show.v1}
            checklist: {const: onboard_v1}
            active: {type: boolean}
            ok: {type: boolean}
            steps: {type: array}
    exec: |
      set -eu
      : "${PROOF_BIN:?PROOF_BIN is required}"
      : "${TARGET_ROOT:?TARGET_ROOT is required}"
      cd "$TARGET_ROOT"
      if [ ! -f proof.yaml ]; then
        printf '%s\n' '{"bootstrap_required":true}'
        exit 0
      fi
      exec "$PROOF_BIN" checklist show onboard_v1 --format json

  author:
    type: ai
    # The missing-output guard keeps the initial plan from filtering this
    # check before native-state has produced its result.  Dispatch evaluates
    # the same expression again with the actual native-state output.
    if: "!outputs['native-state'] || outputs['native-state'].bootstrap_required === true || outputs['native-state'].ok !== true || outputs['proof-audit'] || outputs['native-completion']"
    depends_on: [native-state, target-binding]
    timeout: 660000
    criticality: internal
    assume: "true"
    # An already-ok native checklist intentionally skips this author on the
    # first wave; the independent audit must still run and can route the
    # author back when its own evidence fails.
    continue_on_failure: true
    ai_model: gpt-5.6-luna
    ai_prompt_type: engineer
    schema: plain
    ai:
      allowEdit: true
      max_iterations: 100
      ai_timeout: 600000
      codex_execution_profile: luna-xhigh-isolated-writer-v1
      codex_working_directory_from: target-binding
    prompt: |
      Work only in the current subject repository. You are an editable native
      Proof onboarding author, not the completion authority.

      Read the native state below. If bootstrap_required is true, or the native
      show is inactive, use the native Proof help/init/checklist commands to
      establish the project before doing other work. Otherwise repeatedly read
      the native checklist and
      choose only its current `next` or explicitly eligible row. For each row,
      load its native role with `$PROOF_BIN role show <role> --format agent`,
      follow that role, run every row-provided required check, and confirm only
      through the native Proof command that the role specifies. Re-read the
      checklist after each native confirmation, then return after one bounded,
      coherent unit of current role work; do not wait indefinitely for native
      `ok:true` or claim completion from an incomplete unit.

      Do not invent a stage table or check IDs. Do not waive, ignore, mute,
      lower policy, rewrite history, fabricate approval, or edit outside the
      current subject and the native role's allowed surface. Do not change
      executable source behavior; only Proof-native authored requirements,
      variables, and role-permitted source annotations/comments are in scope.
      Branches, commits, and pushes belong to the outer orchestrator.

      --- native-state (authoritative input) ---
      {{ outputs['native-state'] | json }}

      --- selected target checkout (binding authority) ---
      {{ outputs['target-binding'] | json }}

      --- latest independent Proof audit diagnostic (bounded) ---
      {% if outputs['proof-audit'] %}
      {{ outputs['proof-audit'] | json }}
      {% else %}
      (no prior Proof audit has run)
      {% endif %}

      --- latest native completion readback (bounded) ---
      {% if outputs['native-completion'] %}
      {{ outputs['native-completion'] | json }}
      {% else %}
      (no prior native completion readback has run)
      {% endif %}

      The audit diagnostic includes relative target-checkout artifact paths.
      Inspect a referenced artifact only when needed; never paste its full
      contents into your response. Complete one bounded, coherent unit of the
      current native Proof role, run every row-required check/evidence before
      confirmation, and return before the 600-second author budget even if the
      current unit is incomplete. The independent Proof audit and native
      checklist readback decide completion; never claim completion from an
      incomplete unit.

  proof-audit:
    type: command
    depends_on: [author]
    timeout: 1200000
    criticality: internal
    assume: "true"
    output_format: json
    schema:
      type: object
      additionalProperties: false
      required: [audit_exit_code, stdout_artifact, stderr_artifact, terminal]
      properties:
        audit_exit_code: {type: integer, minimum: 0}
        stdout_artifact: {type: string, minLength: 1}
        stderr_artifact: {type: string, minLength: 1}
        terminal:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [event, check, status]
              properties:
                event: {type: string}
                check: {type: string}
                status: {type: string}
    exec: |
      set -eu
      : "${PROOF_BIN:?PROOF_BIN is required}"
      : "${TARGET_ROOT:?TARGET_ROOT is required}"
      cd "$TARGET_ROOT"
      AUDIT_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
      AUDIT_ROOT="$(mktemp -d "$TARGET_ROOT/.visor-native-checklist-audit.${AUDIT_STAMP}.XXXXXX")"
      AUDIT_STDOUT="$AUDIT_ROOT/audit.stdout.jsonl"
      AUDIT_STDERR="$AUDIT_ROOT/audit.stderr.log"
      set +e
      "$PROOF_BIN" audit --no-cache --fail-level warn --format json --max-findings 0 >"$AUDIT_STDOUT" 2>"$AUDIT_STDERR"
      AUDIT_EXIT_CODE=$?
      set -e
      node - "$TARGET_ROOT" "$AUDIT_STDOUT" "$AUDIT_STDERR" "$AUDIT_EXIT_CODE" <<'NODE'
      const fs = require('fs');
      const path = require('path');
      const [targetRoot, stdoutPath, stderrPath, exitText] = process.argv.slice(2);
      const stdout = fs.readFileSync(stdoutPath, 'utf8');
      const lines = stdout.split(/\r?\n/).filter(line => line.trim().length > 0);
      let terminal = null;
      if (lines.length > 0) {
        try {
          const parsed = JSON.parse(lines[lines.length - 1]);
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            terminal = { event: parsed.event, check: parsed.check, status: parsed.status };
          }
        } catch {}
      }
      const exitCode = Number.parseInt(exitText, 10);
      const rel = file => path.relative(targetRoot, file).split(path.sep).join('/');
      const result = {
        audit_exit_code: Number.isInteger(exitCode) && exitCode >= 0 ? exitCode : 1,
        stdout_artifact: rel(stdoutPath),
        stderr_artifact: rel(stderrPath),
        terminal,
      };
      process.stdout.write(JSON.stringify(result));
      NODE
    # The full native audit remains in target-local artifacts. Only this tiny
    # receipt reaches the graph and author prompt; the original terminal-row
    # guard plus the true native exit code preserve failure semantics.
    fail_if: "!output || output.audit_exit_code !== 0 || !output.terminal || output.terminal.event !== 'check_done' || typeof output.terminal.check !== 'string' || output.terminal.check.length === 0 || !['pass', 'skip', 'info'].includes(output.terminal.status)"
    on_fail:
      goto: author

  native-completion:
    type: command
    depends_on: [proof-audit]
    timeout: 120000
    criticality: internal
    assume: "true"
    output_format: json
    schema:
      type: object
      additionalProperties: true
      required: [schema_version, checklist, active, ok, steps]
      properties:
        schema_version: {const: proof.checklist.show.v1}
        checklist: {const: onboard_v1}
        active: {const: true}
        ok: {type: boolean}
        steps: {type: array}
    exec: |
      set -eu
      : "${PROOF_BIN:?PROOF_BIN is required}"
      : "${TARGET_ROOT:?TARGET_ROOT is required}"
      cd "$TARGET_ROOT"
      "$PROOF_BIN" checklist show onboard_v1 --format json
    fail_if: "!output || output.ok !== true"
    on_fail:
      goto: author
